[build]
  base = "zzo.ricc.rocks"
  publish = "public"
  command = "hugo --minify"

[build.environment]
  # Using Hugo 0.128.2 - compatible with Netlify's Ubuntu 20.04 (GLIBC 2.31)
  # Note: v0.150.1 requires GLIBC 2.32+ which is not available in current build image
  HUGO_VERSION = "0.128.2"
  
[context.production.environment]
  HUGO_ENV = "production"

# Ensure git submodules are properly initialized
[build.processing]
  skip_processing = false

# ---------------------------------------------------------------------------
# Free Netlify HTTP Security & Edge Cache Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sass/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

